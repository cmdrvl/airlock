policy_id: tamper_matrix
version: airlock.v0
allowed_keys:
  - key_path: family_id
    description: Filing family identifier
    boundary_class: TELEMETRY
  - key_path: current_strategy
    description: Current deterministic strategy selection
    boundary_class: TELEMETRY
  - key_path: allowed_toggles
    description: Operator-approved mutator toggles
    boundary_class: TELEMETRY
  - key_path: max_proposals
    description: Proposal budget for the current round
    boundary_class: TELEMETRY
  - key_path: benchmark_summary
    description: Frozen benchmark summary for the active filing
    boundary_class: TELEMETRY
  - key_path: unresolved_failure_fields
    description: Unresolved benchmark failures
    boundary_class: TELEMETRY
  - key_path: recent_lineage_rows
    description: Recent lineage telemetry rows
    boundary_class: TELEMETRY
  - key_path: heuristic_reference
    description: Heuristic reference bundle
    boundary_class: TELEMETRY
  - key_path: mutator_context.challenge_observation
    description: Structural challenge summary for annotated mode
    boundary_class: DERIVED_TEXT
  - key_path: mutator_context.challenge_profile.header_surfaces
    description: Header surface observations for annotated mode
    boundary_class: DERIVED_TEXT
  - key_path: mutator_context.challenge_profile.layout_notes
    description: Layout note observations for annotated mode
    boundary_class: DERIVED_TEXT
forbidden_keys:
  - html_path
  - section_html
  - pdf_path
  - page_images
forbidden_patterns:
  - pattern: "<[a-z][^>]*>"
    description: Raw HTML markup must not cross the model boundary
    artifact_class: raw_html
  - pattern: sec\.gov/Archives
    description: SEC archive URLs must not cross the model boundary
    artifact_class: sec_archive_url
derived_text_paths:
  - mutator_context.challenge_observation
  - mutator_context.challenge_profile.header_surfaces
  - mutator_context.challenge_profile.layout_notes
claim_levels:
  - BOUNDARY_FAILED
  - RAW_DOCUMENT_ABSENT
  - STRICT_TELEMETRY_ONLY
detectors:
  - secrets
  - pii
  - tabular
  - blobs
  - paths
declared_tool_results:
  - artifact_hash: blake3:de065565e3e7dc131ce11b2ece4edae3ef1647057601682b55aa417984c9e82f
    description: Lineage lookup result for family F-17 (fixtures/tamper_matrix/chain/tool_declared.txt)
  - artifact_hash: blake3:20cfe51cf3a6598c4576b6420340c7d1258bc4ecd0b25e723012c3f88e41e176
    description: Declared artifact that carries an SSN, to show that declaring does not exempt it from the detectors (fixtures/tamper_matrix/chain/tool_pii.txt)
