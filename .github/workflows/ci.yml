name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  rust:
    name: fmt-clippy-test-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Install ast-grep
        run: npm install --global @ast-grep/cli

      - name: Spine static rules (ast-grep)
        run: ast-grep scan

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --locked --release

      # Runs the release binary over the tamper matrix (needs jq, preinstalled on the runner),
      # then fails if regenerating docs/tamper-matrix.md changed it. The script writes the doc
      # only when every cell matches fixtures/tamper_matrix.json.
      - name: Tamper matrix e2e
        run: bash tests/e2e_tamper_matrix.sh
        env:
          AIRLOCK_BIN: target/release/airlock

      - name: Fail if docs/tamper-matrix.md drifted
        run: git diff --exit-code -- docs/tamper-matrix.md

  # tests/egress_seatbelt.rs is compiled only on macOS, so the ubuntu job above never runs it.
  # It runs the Seatbelt profile from docs/deploy/egress-firewall.md against the real gate; if
  # the runner cannot apply a sandbox profile the test fails rather than skips.
  macos-seatbelt-egress:
    name: macos-seatbelt-egress
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Prove the Seatbelt egress recipe
        run: cargo test --locked --test egress_seatbelt
